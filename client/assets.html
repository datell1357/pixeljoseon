<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>등불길 에셋 상태</title>
<style>
  :root {
    --bg: #14121a; --panel: #1d1a24; --panel2: #262230; --line: #34303f; --text: #ece6da; --dim: #a39c8f;
    --ok: #7ed492; --warn: #e8b85a; --bad: #ef6b6b; --accent: #f0a04b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  header { height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .tabs { display: flex; gap: 8px; }
  .tabs button, .seg button { height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  .tabs button.on, .seg button.on { background: var(--accent); border-color: var(--accent); color: #1a1208; font-weight: 700; }
  .summary { margin-left: auto; color: var(--dim); display: flex; gap: 16px; }
  .summary b { color: var(--text); }
  main { display: flex; height: calc(100% - 56px); }
  aside { width: 288px; border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  aside h2 { font-size: 12px; color: var(--dim); margin: 16px 0 8px; font-weight: 600; }
  aside h2:first-child { margin-top: 0; }
  .item { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: var(--panel); }
  .item.on { background: var(--panel2); }
  .item .nm { flex: 1; }
  .badge { font-size: 11px; padding: 0 8px; height: 24px; line-height: 24px; border-radius: 8px; white-space: nowrap; }
  .badge.ok { background: #1f3a27; color: var(--ok); }
  .badge.warn { background: #3d3119; color: var(--warn); }
  .badge.bad { background: #431f22; color: var(--bad); }
  section.view { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { position: relative; flex: 1; overflow: hidden; background: #0c0b10; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage .hint { position: absolute; left: 16px; bottom: 16px; color: var(--dim); font-size: 12px; z-index: 2; background: rgba(0,0,0,.45); padding: 0 8px; height: 24px; line-height: 24px; border-radius: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 24px; border-top: 1px solid var(--line); align-items: center; }
  .controls label { color: var(--dim); font-size: 12px; margin-right: 8px; }
  .seg { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .info { width: 320px; border-left: 1px solid var(--line); overflow-y: auto; padding: 24px; }
  .info h3 { margin: 0 0 8px; font-size: 20px; }
  .info .sub { color: var(--dim); margin-bottom: 16px; }
  .info table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  .info td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .info td:first-child { color: var(--dim); width: 112px; }
  .info h4 { margin: 0 0 8px; font-size: 13px; color: var(--dim); }
  .grid { flex: 1; overflow-y: auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .card canvas { image-rendering: pixelated; width: 96px; height: 96px; }
  .card .nm { font-weight: 600; text-align: center; }
  .card .id { color: var(--dim); font-size: 12px; }
  .hidden { display: none !important; }
  @media (max-width: 960px) { .info { display: none; } aside { width: 224px; } }
</style>
</head>
<body>
<header>
  <h1>등불길 에셋 상태</h1>
  <div class="tabs" id="tabs"></div>
  <div class="summary" id="summary"></div>
</header>
<main>
  <aside id="list"></aside>
  <section class="view" id="viewer">
    <div id="stage"><div class="hint">끌어서 돌리기</div></div>
    <div class="controls" id="controls"></div>
  </section>
  <div class="info" id="info"></div>
  <div class="grid hidden" id="grid"></div>
</main>
<script type="module" src="/src/render3d/assets.ts"></script>
</body>
</html>
